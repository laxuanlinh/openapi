openapi: 3.0.1
info:
  description: API for managing a single order
  title: Order API
  version: 1.0.0
servers:
- url: https://orderservice.example.com/api
paths:
  /order:
    get:
      operationId: getOrder
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
          description: The current order
        "404":
          description: Order not found
        "500":
          description: Internal server error
      summary: Get the current order
      tags:
      - Order
      x-accepts:
      - application/json
    post:
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
        required: true
      responses:
        "201":
          description: Order created successfully
        "400":
          description: Invalid order data
        "500":
          description: Internal server error
      summary: Create a new order
      tags:
      - Order
      x-content-type: application/json
      x-accepts:
      - application/json
    put:
      operationId: updateOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
        required: true
      responses:
        "200":
          description: Order updated successfully
        "400":
          description: Invalid order data
        "404":
          description: Order not found
        "500":
          description: Internal server error
      summary: Update the current order
      tags:
      - Order
      x-content-type: application/json
      x-accepts:
      - application/json
components:
  schemas:
    Order:
      example:
        totalAmount: 0.8008282
        orderId: orderId
        orderDate: 2000-01-23T04:56:07.000+00:00
        items:
        - quantity: 6
          productId: productId
          price: 1.4658129
        - quantity: 6
          productId: productId
          price: 1.4658129
        customerName: customerName
      properties:
        orderId:
          description: Unique identifier for the order
          type: string
        customerName:
          description: The name of the customer who placed the order
          type: string
        orderDate:
          description: The date when the order was placed
          format: date-time
          type: string
        totalAmount:
          description: The total amount of the order
          format: float
          type: number
        items:
          items:
            $ref: "#/components/schemas/OrderItem"
          type: array
      type: object
    OrderItem:
      example:
        quantity: 6
        productId: productId
        price: 1.4658129
      properties:
        productId:
          description: ID of the product in the order
          type: string
        quantity:
          description: Quantity of the product ordered
          type: integer
        price:
          description: Price of a single unit of the product
          format: float
          type: number
      type: object

