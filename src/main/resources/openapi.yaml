openapi: 3.0.1
info:
  title: User API
  version: 1.0.0
paths:
  /user:
    get:
      summary: Get a user
      operationId: getUser
      responses:
        '200':
          description: A user object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /user/{id}:
    get:
      operationId: getUserById
      summary: Get user details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /user/{id}/profile:
    get:
      operationId: getUserProfile
      summary: Get user profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: User profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
      required:
        - id
        - username
        - email
    UserProfile:
      type: object
      properties:
        id:
          type: string
        bio:
          type: string
        profilePictureUrl:
          type: string
      required:
        - id
