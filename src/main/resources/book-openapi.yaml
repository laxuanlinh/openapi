openapi: 3.0.0
info:
  title: Book API
  version: 1.0.0
tags:
  - name: Book
    description: Operations related to users
paths:
  /book:
    get:
      operationId: getBooks
      summary: Get a list of books
      tags:
        - Book
      responses:
        200:
          description: A list of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /book/{id}:
    get:
      operationId: getBookById
      summary: Get book details by ID
      tags:
        - Book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'

components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        publishedDate:
          type: string
          format: date
      required:
        - id
        - title
        - author
